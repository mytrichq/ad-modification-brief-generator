const branchBtn = (m) => `<button class="ib" data-branch="${esc(m.mod_id)}" aria-label="Use ${esc(m.title)} as the next original" title="Use as next original">${I.branch}</button>`;
function briefSections(r, approved) {
  const hooks = approved.filter((m) => m.mod_type === 'hook');
  const rest = approved.filter((m) => m.mod_type !== 'hook' || hooks.length < 2);
  let html = '';
  if (hooks.length >= 2) {
    const touched = new Set(hooks.flatMap((m) => resOf(m.mod_id).changes.map((c) => c.scene)));
    const body = r.script.scenes.map((s) => s.scene).filter((n) => !touched.has(n));
    html += `<section><div class="sh"><h2>Hook stack · ${plural(hooks.length, 'opening')}</h2><span class="mono">one edit session</span></div>
      <p class="stack-note">Build the body once${body.length ? ` (scene${body.length > 1 ? 's' : ''} ${rangeText(body)} from the original edit)` : ''}, then export one ad per opening.</p>
      ${hooks.map((m) => { const res = resOf(m.mod_id); return `<div class="stack-item"><div class="sh"><h3>${esc(m.title)}</h3><span class="mono">${esc(m.mod_id.split('-').pop())}</span>${effortHtml(res.production)}${branchBtn(m)}</div><div class="bgrid">${briefRows(m, res)}</div></div>`; }).join('')}
    </section>`;
  }
  html += rest.filter((m) => !(hooks.length >= 2 && m.mod_type === 'hook')).map((m) => {
    const res = resOf(m.mod_id);
    return `<section><div class="sh"><h2>${esc(m.title)}</h2><span class="mono">${esc(m.mod_id.split('-').pop())} · ${esc(TYPE[m.mod_type] || m.mod_type)}</span>${branchBtn(m)}</div>
      ${effortHtml(res.production)}${directionHtml(m.direction)}

  }).join('');

}
function rangeText(ns) {

  for (const n of [...ns.slice(1), null]) { if (n === p + 1) { p = n; continue; } out.push(a === p ? `${a}` : `${a}–${p}`); a = p = n; }

}
let lastLearnAt = null;
